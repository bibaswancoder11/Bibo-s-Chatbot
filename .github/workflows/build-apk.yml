name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Functional Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application (Vite)
        run: |
          npm run build

      - name: Initialize Android project with Capacitor
        run: |
          # Add android platform if not already created
          if [ ! -d "android" ]; then
            echo "Adding Capacitor Android platform..."
            npx cap add android
          fi

          # Sync web dist assets and plugins to android project
          echo "Syncing web assets to Android..."
          npx cap sync android

      - name: Configure Android Permissions & Cleartext Network Access
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            echo "Checking Android Manifest permissions..."
            # Ensure Internet and Network State permissions
            if ! grep -q "android.permission.INTERNET" "$MANIFEST_PATH"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET" />' "$MANIFEST_PATH"
            fi
            if ! grep -q "android.permission.ACCESS_NETWORK_STATE" "$MANIFEST_PATH"; then
              sed -i '/<manifest/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' "$MANIFEST_PATH"
            fi
            # Enable cleartext traffic for local network LLM servers (like Ollama on LAN)
            sed -i 's/<application /<application android:usesCleartextTraffic="true" /' "$MANIFEST_PATH" || true
            echo "Updated AndroidManifest.xml successfully."
          fi

      - name: Build Android Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build Android Release APK (Unsigned)
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Locate & Prepare APK Artifact
        id: locate-apk
        run: |
          mkdir -p build-output
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -n 1)
          
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" build-output/Local-AI-Studio-debug.apk
            echo "Found debug APK: $DEBUG_APK"
            echo "apk_path=build-output/Local-AI-Studio-debug.apk" >> $GITHUB_OUTPUT
            echo "apk_name=Local-AI-Studio-debug.apk" >> $GITHUB_OUTPUT
          elif [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" build-output/Local-AI-Studio-release-unsigned.apk
            echo "Found release APK: $RELEASE_APK"
            echo "apk_path=build-output/Local-AI-Studio-release-unsigned.apk" >> $GITHUB_OUTPUT
            echo "apk_name=Local-AI-Studio-release-unsigned.apk" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Could not locate built APK."
            find android/app/build/outputs/ -type f || true
            exit 1
          fi

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate-apk.outputs.apk_name }}
          path: ${{ steps.locate-apk.outputs.apk_path }}
          retention-days: 30

      - name: Summary
        run: |
          echo "### 🎉 Android APK Generated Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **App Name:** Local AI Studio" >> $GITHUB_STEP_SUMMARY
          echo "- **Package:** com.localai.studio" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`${{ steps.locate-apk.outputs.apk_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "You can download the \`.apk\` file directly from the **Artifacts** section of this GitHub Actions run and install it on your Android device." >> $GITHUB_STEP_SUMMARY
